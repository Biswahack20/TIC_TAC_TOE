<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>body{
    background-color: darkcyan;
    text-align: center;
}
.container{
    height: 70vh;
    display: flex;
    justify-content: center;
    align-items: center;
       }
.game{
    height:60vmin;
    width: 60vmin;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 1.5vmin;
}
.box{
    height:18vmin;
    width: 18vmin;
    border-radius: 1rem;
    border: none;
    box-shadow: 0 0 1rem rgba(0,0,0,0.1);
    font-size: 8vmin;
    background-color: rgb(247, 230, 209);
    color: rgb(2, 2, 50);
}
#reset {
    padding: 1rem;
    font-size: 1.25rem;
    background-color: rgb(200, 12, 12);
    color: bisque;
    border-radius: 2rem;
    border: none;
}
#new {
    padding: 1rem;
    font-size: 1.25rem;
    background-color: black;
    color: bisque;
    border-radius: 2rem;
    border: none;
    margin-left: 1rem;
}
#status{
    background-color: brown;
    text-align: center;
    color: whitesmoke;
}
</style>
</head>
<body>
    <main>
        <h1>TIC TAC TOE</h1>
        <div id="status"></div>
        <div class="container">
        <div class="game">
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
            <button class="box"></button>
        </div>
        </div>
        <nav>
            <button id="reset">Reset</button>
            <button id="new">New Game</button>
        </nav>
        <script>
            let cell=document.querySelectorAll(".box");
            let reset=document.getElementById("reset");
            let status=document.getElementById("status");
            let newgame=document.getElementById("new");
            let turno=false;
            let win=[
                [0,1,2],
                [3,4,5],
                [6,7,8],
                [0,3,6],
                [1,4,7],
                [2,5,8],
                [0,4,8],
                [2,4,6]
            ];
reset.addEventListener("click",function(){
    cell.forEach(function(box){
        box.innerText="";
        box.disabled=false;
        box.style.backgroundColor="";
        turn0=false;
        status.innerText="";
    });
});
newgame.addEventListener("click",function(){
    cell.forEach(function(box){
    status.innerText="";
    box.disabled=false;
    box.style.backgroundColor="";
    turno=false;
    box.innerText="";
    });
});
cell.forEach(function(box){
    box.addEventListener("click",function(){
        if(turno==false){
            box.innerText="X";
            turno=true;
        }else{
            box.innerText="O";
            turno=false;
        }
        box.disabled=true;
        checkwin();
    });

});
function checkwin(){
    for(let i=0;i<win.length;i++){
        let a=cell[win[i][0]].innerText;
        let b=cell[win[i][1]].innerText; 
        let c=cell[win[i][2]].innerText;
        if(a!=""&&a==b&&b==c){
            status.innerText=a+" is winner";
            cell[win[i][0]].style.backgroundColor="lightgreen";
            cell[win[i][1]].style.backgroundColor="lightgreen";
            cell[win[i][2]].style.backgroundColor="lightgreen";
            cell.forEach(function(box){
        box.disabled=true;
    });
            reset.disabled=true;
            return;
    }    
}
let tie=true;
    cell.forEach(function(box){
        if(box.innerText === "" ){
            tie=false;
        }
});
    if(tie === true){
        status.style.backgroundColor="red";
        status.innerText="it's a tie,lets play once again";
    }
}
        

        </script>
    </main>
</body>
</html>
